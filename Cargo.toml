[package]
name = "tornado-kasa"
version = "0.1.4"
edition = "2021"
description = "Mali lokalni server: JSON komande iz web appa -> XML za Tring.Fiscal.Server"

[dependencies]
tiny_http = "0.12"
ureq = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Mali exe i malo RAM-a.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
